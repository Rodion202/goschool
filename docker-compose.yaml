services:
  postgres:
    image: postgres:16
    
    container_name: my_postgres

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
        - postgres_data:/var/lib/postrgesql/postgres_data

volumes:
  postgres_data:
